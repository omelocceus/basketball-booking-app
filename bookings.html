<!DOCTYPE html>
<html>
<head>
<title>Book Training</title>

<link rel="stylesheet" href="bookings.css">
</head>

<body>

  <div class="logo-container">
  <img 
    src="all aroudn development picture.PNG" 
    alt="All Around Sports Development"
    class="logo"
  >
</div>

<div id="main">
    <!-- MAIN HEADER -->

    <h1>Book a Training Session</h1>

    <!-- Date Picker -->
    <label>Select Date:</label>
    <input type="date" id="datePicker"><br><br>

    <button id="viewTimesBtn">View Available Times</button>

    <!-- AVAILABLE TIME SLOTS-->

    <h2>Available Times</h2>
    <div id="timeSlots">

    </div>

    <hr>

    <h2>Book Selected Time</h2>

    <!-- USER FORM -->

    <input type="text" id="name" placeholder="Name"><br><br>
    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="number" id="phone" placeholder="Phone number"><br><br>
    

    <!-- TRAINING TYPE SELECTION -->

    <label>Select Training Type:</label>

<select id="trainingType">

  <option value="oncourt"> On Court Training - $60</option>

  <option value="sand"> Sand Training - $50</option>

  <option value="weight"> Weight Training - $50</option>

</select>

<br><br>

    <!-- BOOK BUTTON -->
    <button id="bookBtn">Book Now</button>
    <img src=""><br><br><br>

    <input type="hidden" id="selectedTime">


    <p id="message"></p>

</div>
<script src = "bookings.js"></script>



</script>

</body>
</html>
