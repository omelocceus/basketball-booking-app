services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking_app
      POSTGRES_USER: booking_app
      POSTGRES_PASSWORD: booking_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_app -d booking_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
